{% extends 'base.html' %}
{% load static %}

{% block title %}パスワードリセット送信完了{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title mb-0">
                        <i class="fas fa-check-circle me-2"></i>送信完了
                    </h3>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-envelope fa-3x text-success mb-3"></i>
                    <h4>パスワードリセットメールを送信しました</h4>
                    <p class="text-muted">
                        登録されたメールアドレスにパスワードリセット用のリンクを送信しました。
                        メールを確認して、リンクをクリックして新しいパスワードを設定してください。
                    </p>
                </div>
                <div class="card-footer text-center">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-1"></i>ログインに戻る
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
