{% extends 'base.html' %}
{% load static %}

{% block title %}パスワードリセット{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title mb-0">
                        <i class="fas fa-lock me-2"></i>パスワードリセット
                    </h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        登録されたメールアドレスにパスワードリセット用のリンクを送信します。
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">メールアドレス</label>
                            {{ form.email }}
                            {% if form.email.errors %}
                                <div class="text-danger">{{ form.email.errors }}</div>
                            {% endif %}
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-paper-plane me-1"></i>リセットリンクを送信
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a href="{% url 'accounts:login' %}">ログインに戻る</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
